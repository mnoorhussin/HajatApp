name: Deploy Landing Page

on:
  push:
    branches: [ main ]

# One deploy at a time. A single push to the admin dashboard once produced two
# workflow runs, and both ran `git pull` into the same checkout on the VPS at
# the same second; the race left git unable to fast-forward and it aborted.
# Every service here deploys the same way into its own directory, so the same
# race applies. cancel-in-progress is false on purpose: cancelling a deploy
# mid-pull is what would actually leave a half-updated working tree.
concurrency:
  group: deploy-landing-page
  cancel-in-progress: false

jobs:
  # nginx refuses to start on a bad config, and the deploy rebuilds the live
  # container from nginx.conf — so one typo there takes the site down. This
  # runs the same image against the real config on GitHub's runner first, and
  # the deploy `needs` it. It also checks the security headers really come
  # back on a page, an SPA route and an asset: nginx drops every inherited
  # add_header in a location that sets its own, which is easy to regress.
  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nginx -t
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t

      - name: Security headers on pages and assets
        run: |
          docker run -d --name web -p 8080:80 -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 0.5; done
          fail=0
          for path in / /some/spa/route /missing.js /site.webmanifest; do
            h=$(curl -s -D - -o /dev/null "http://localhost:8080$path" | tr -d '\r')
            for want in "content-security-policy: frame-ancestors 'none'" "x-frame-options: deny" "x-content-type-options: nosniff"; do
              if ! printf '%s\n' "$h" | grep -qi "^$want"; then echo "::error::$path is missing '$want'"; fail=1; fi
            done
          done
          docker rm -f web > /dev/null
          exit $fail

  deploy:
    needs: nginx-config
    runs-on: ubuntu-latest
    environment: hajat_dashboard_var
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          # Increase timeout for heavy builds
          command_timeout: 20m
          script: |
            # Abort on the first failure. Without this a failed `git pull` fell
            # through to the rebuild below, so the container was rebuilt from
            # the OLD checkout and the workflow still reported success — a
            # silent stale deploy, which is worse than a loud failure.
            set -e

            # 1. Enter the specific service directory
            cd /opt/hajat-app/services/landing_page

            # 2. Pull the latest code.
            #    -c pull.ff=only: a deploy should only ever fast-forward this
            #    checkout. If it cannot, say so plainly instead of emitting the
            #    "specify how to reconcile divergent branches" hint, which reads
            #    like missing config rather than the server holding commits that
            #    main does not.
            #    Auth is left as-is: this one pulls via the `origin` remote,
            #    whose credentials already live on the VPS.
            git -c pull.ff=only pull origin main
            
            # 3. Move to the infrastructure folder to trigger the rebuild
            cd /opt/hajat-app/infrastructure
            
            # 4. Rebuild ONLY this specific container
            # This ensures no downtime for your other apps
            docker compose up -d --build landing_page
            
            # 5. Optional: Clean up old image layers to save space
            docker image prune -f 