server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Text compression ──────────────────────────────────────────────────
    #
    # There was none. The origin returned no Content-Encoding header at all,
    # so vendor-react went over the wire at its full 192KB instead of ~52KB
    # and the stylesheet at 56KB instead of ~9KB. Lighthouse costed that at
    # about 1.5s on mobile — the single largest remaining item on the page.
    #
    # The build already writes a .gz beside every asset (vite-plugin-compression
    # in vite.config.ts), so gzip_static can hand those straight to the client
    # with no per-request CPU and a better ratio than on-the-fly gzip. gzip on
    # is only the fallback for responses with no precompressed sibling.
    #
    # The build also emits .br files. Stock nginx has no brotli module, so they
    # are simply unused here; they cost a little image size and are left in
    # place because gzip is within ~3KB of brotli on these bundles.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html is always compressed when gzip is on and must not be listed.
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────
    #
    # There were none, so any site could frame this page — including the
    # captain application form, with its sign-in and ID uploads — and steer
    # clicks on it (clickjacking).
    #
    #   CSP            frame-ancestors 'none' is the clickjacking fix;
    #                  object-src/base-uri/form-action close plugin, <base> and
    #                  form-hijack tricks. script/style/connect are deliberately
    #                  NOT restricted: index.html has an inline script and the
    #                  page talks to db./api. and Google Fonts; nothing renders
    #                  raw HTML (no dangerouslySetInnerHTML).
    #                  The apps open these pages top-level (Linking.openURL,
    #                  legal screen), never in an iframe, so they are unaffected.
    #   XFO            the same clickjacking fix for browsers without CSP.
    #   nosniff        a response is only ever run as the type it is served as.
    #   Referrer       outbound links carry the origin only, not the path.
    #   Permissions    no mic, location or payments. camera is left alone: the
    #                  captain form takes ID photos through a file input.
    #   HSTS           HTTPS only for a year. No includeSubDomains: that would
    #                  bind every *.hajatapp.com host, not ours to decide here.
    #
    # `always` adds them to error responses too. nginx drops ALL inherited
    # add_header lines in any location that sets its own, so the asset block
    # below repeats them — CI (nginx-config job) checks both paths.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repeated: see "Security headers" above.
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Serve webmanifest with correct MIME type
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
    }
}
